<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Уведомления — DoorFlow</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<script src="assets/db.js"></script>
<script src="assets/app.js"></script>
<script>
const DB = window.VDX_DB;

function renderNotifPage() {
  const wrap = document.getElementById('notif-list');
  if (!wrap) return;
  wrap.innerHTML = DB.notifications.length
    ? DB.notifications.map(n => notifItem(n, false)).join('')
    : emptyState('Уведомлений нет.');
}

const content = `
${pageHead('DoorFlow Tower · демо-аккаунт', 'Уведомления', 'Здесь появляется всё, что требует решения человека.',
  `<button class="btn outline" onclick="markAllRead()">Отметить всё как прочитанное</button>`)}
<div class="notiflist" id="notif-list"></div>
`;

renderShell('', content);
renderNotifPage();
</script>
</body>
</html>
