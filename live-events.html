<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>События live — Vadalex Access</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<script src="assets/db.js"></script>
<script src="assets/app.js"></script>
<script>
const DB = window.VDX_DB;
let streaming = true;
let resultFilter = 'Все';
let timer = null;

function eventRow(e) {
  const cls = tagClass(e.result);
  return `<div class="row">
    <span class="person ${cls==='bad'?'bad':cls==='warn'?'warn':''}">${e.initials}</span>
    <div class="info">
      <div class="name">${e.person} ${e.unit ? `<span>${e.unit}</span>` : ''}</div>
      <div class="meta">
        <i>${svg('doors')}${e.door}</i>
        <i>${svg('scanFace')}${e.credential==='лицо'?'Лицо':'Карта'}</i>
        ${e.confidence ? `<i>Увер. ${e.confidence}%</i>` : ''}
      </div>
    </div>
    <div class="result">
      <span class="tag ${cls}">${e.result}</span>
      <span class="time">${e.time}</span>
    </div>
  </div>`;
}

function renderEvents() {
  let rows = DB.events;
  if (resultFilter !== 'Все') rows = rows.filter(e => e.result === resultFilter);
  document.getElementById('ev-rows').innerHTML = rows.length ? rows.map(eventRow).join('') : emptyState('Событий по этому фильтру нет.');
}
function setResultFilter(v) { resultFilter = v; document.querySelectorAll('#ev-tabs .ftab').forEach(b => b.classList.toggle('active', b.textContent === v)); renderEvents(); }

const names = [['Анна Петрова','АП'],['Марк Ли','МЛ'],['Дмитрий Соколов','ДС'],['Елена Варгас','ЕВ'],['Игорь Волков','ИВ']];
const doors = DB.doors.map(d=>d.name);
function pushRandomEvent() {
  const n = names[Math.floor(Math.random()*names.length)];
  const results = ['Разрешено','Разрешено','Разрешено','Отказано'];
  const r = results[Math.floor(Math.random()*results.length)];
  const now = new Date();
  const time = now.toLocaleTimeString('ru-RU');
  DB.events.unshift({ person: n[0], initials: n[1], unit: null, door: doors[Math.floor(Math.random()*doors.length)],
    credential: Math.random()>0.4?'лицо':'карта', confidence: Math.random()>0.4 ? (90+Math.random()*9).toFixed(1) : null, result: r, time });
  if (DB.events.length > 60) DB.events.pop();
  renderEvents();
}

function toggleStream() {
  streaming = !streaming;
  const btn = document.getElementById('stream-btn');
  btn.innerHTML = streaming ? `${svg('pulse')}Пауза` : `${svg('pulse')}Возобновить`;
  document.getElementById('stream-pill').style.display = streaming ? '' : 'none';
  if (streaming) startStream(); else clearInterval(timer);
}
function startStream() { timer = setInterval(pushRandomEvent, 4000); }

const tabs = ['Все','Разрешено','Отказано','Не опознан','Доступ истёк','Дверь открыта','Взлом двери'];
const content = `
${pageHead('Vadalex Tower · демо-аккаунт', 'События live', 'Всё, что происходит у ваших дверей — в реальном времени.',
  `<div style="display:flex;gap:8px;align-items:center">
     <span class="pill ok" id="stream-pill">${svg('pulse')}Трансляция</span>
     <button class="btn outline" id="stream-btn" onclick="toggleStream()">${svg('pulse')}Пауза</button>
   </div>`)}

<div id="ev-tabs">${filterTabs('ev', tabs, 'Все', 'setResultFilter')}</div>
<section class="panel" style="margin-top:16px">
  <div class="panel-head"><div><h2>Поток событий</h2><p>Новые события появляются сверху</p></div></div>
  <div class="rows" id="ev-rows"></div>
</section>
`;

renderShell('live-events', content);
renderEvents();
startStream();
</script>
</body>
</html>
