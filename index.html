<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Дашборд — Vadalex Access</title>
<link rel="stylesheet" href="assets/fonts.css">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>
<script src="assets/db.js"></script>
<script src="assets/app.js"></script>
<script>
const DB = window.VDX_DB;

function eventRow(e) {
  const cls = tagClass(e.result);
  return `<div class="row">
    <span class="person ${cls==='bad'?'bad':cls==='warn'?'warn':''}">${e.initials}</span>
    <div class="info">
      <div class="name">${e.person} ${e.unit ? `<span>${e.unit}</span>` : ''}</div>
      <div class="meta">
        <i>${svg('doors')}${e.door}</i>
        <i>${svg('scanFace')}${e.credential==='лицо'?'Лицо':'Карта'}</i>
        ${e.confidence ? `<i>Увер. ${e.confidence}%</i>` : ''}
      </div>
    </div>
    <div class="result">
      <span class="tag ${cls}">${e.result}</span>
      <span class="time">${e.time}</span>
    </div>
  </div>`;
}

function deviceRow(d) {
  const cls = tagClass(d.status);
  return `<div class="row device">
    <div class="left">
      <span class="dot ${cls==='bad'?'bad':cls==='warn'?'warn':''}"></span>
      <div class="info">
        <div class="name">${d.name}</div>
        <div class="meta"><i>${d.ip}</i></div>
      </div>
    </div>
    <span class="tag ${cls}">${d.status}</span>
  </div>`;
}

const dash = DB.dashboard;
const content = `
<div class="pagehead">
  <div>
    <div class="eyebrow">Vadalex Tower · демо-аккаунт</div>
    <h1>Доброе утро</h1>
    <p>Вот что сейчас происходит с вашей системой контроля доступа.</p>
  </div>
  <button class="btn">${svg('penLine')}Новая запись</button>
</div>

<div class="health">
  <div class="health-main">
    <span class="ic">${svg('circleCheck')}</span>
    <div>
      <div class="eyebrow">Статус системы</div>
      <strong>Все системы в норме</strong>
      <div class="sub">Проверка: ${DB.system.lastCheck}</div>
    </div>
  </div>
  <div class="metrics">
    <span><span class="dot"></span><b>${DB.system.devices.online}</b> устройств онлайн</span>
    <span><span class="dot bad"></span><b>${DB.system.devices.offline}</b> офлайн</span>
    <span><span class="dot"></span><b>${dash.doorsOnline}</b> дверей онлайн</span>
    <span><span class="dot warn"></span><b>${dash.doorsNeedAttention}</b> требуют внимания</span>
  </div>
  <a class="btn outline" href="system.html">Состояние системы ${svg('arrowUpRight')}</a>
</div>

<div class="stats">
  <div class="stat"><span class="ic">${svg('activity')}</span><div class="eyebrow">Событий сегодня</div><strong>${dash.accessEventsToday.toLocaleString('ru-RU')}</strong></div>
  <div class="stat"><span class="ic">${svg('scanFace')}</span><div class="eyebrow">Распознано лиц</div><strong>${dash.faceRecognitionsToday.toLocaleString('ru-RU')}</strong></div>
  <div class="stat"><span class="ic bad">${svg('shieldAlert')}</span><div class="eyebrow">Доступ запрещён</div><strong>${dash.accessDeniedToday}</strong></div>
  <div class="stat"><span class="ic">${svg('visitors')}</span><div class="eyebrow">Посетители</div><strong>${dash.visitorsToday}</strong></div>
  <div class="stat"><span class="ic">${svg('devices')}</span><div class="eyebrow">Устройств онлайн</div><strong>${dash.devicesOnlineFraction.replace('/',' / ')}</strong></div>
</div>

<div class="grid2">
  <section class="panel">
    <div class="panel-head">
      <div><h2>Последние события доступа</h2><p>Активность по всем дверям</p></div>
      <a href="live-events.html">Все события ${svg('arrowRight')}</a>
    </div>
    <div class="rows">${DB.events.map(eventRow).join('')}</div>
  </section>
  <section class="panel">
    <div class="panel-head">
      <div><h2>Устройства</h2><p>Считыватели и контроллеры</p></div>
      <a href="devices.html">Все ${svg('arrowRight')}</a>
    </div>
    <div class="rows">${DB.devices.map(deviceRow).join('')}</div>
  </section>
</div>

<div class="quick">
  <a class="qcard" href="people.html"><span class="ic">${svg('userPlus')}</span><span><b>Добавить человека</b><small>Регистрация лица и доступа</small></span><span class="go">${svg('arrowUpRight')}</span></a>
  <a class="qcard" href="doors.html"><span class="ic">${svg('doorOpen2')}</span><span><b>Открыть дверь</b><small>Удалённая разблокировка</small></span><span class="go">${svg('arrowUpRight')}</span></a>
  <a class="qcard" href="live-events.html"><span class="ic">${svg('pulse')}</span><span><b>Живые события</b><small>Мониторинг в реальном времени</small></span><span class="go">${svg('arrowUpRight')}</span></a>
</div>
`;

renderShell('dashboard', content);
</script>
</body>
</html>
